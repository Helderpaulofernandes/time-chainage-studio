# Publishes the browser app (the web/ folder) to GitHub Pages on every push to main.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # a failing check stops the publish
      - name: Run the checks
        run: node --test tests/*.test.mjs
      # every script and the stylesheet get the commit as a version, so a browser never mixes old and new files
      - name: Version the files
        run: |
          V=${GITHUB_SHA::8}
          find web/js -name '*.js' -exec sed -i -E "s#((from|import\() *\"\.{1,2}/[^\"?]+\.js)\"#\1?v=$V\"#g" {} +
          sed -i -E "s#(src=\"js/app\.js)\"#\1?v=$V\"#; s#(href=\"css/app\.css)\"#\1?v=$V\"#" web/index.html
          grep -c "?v=$V" web/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
